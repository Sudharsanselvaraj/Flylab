services:
  sim-engine:
    build:
      context: ./services/sim-engine
    ports:
      - "127.0.0.1:8050:8050"
    volumes:
      - ./data:/app/data
      - ./experiments:/app/experiments
      - ./services/sim-engine:/app/services/sim-engine
    environment:
      - NEUPRINT_TOKEN=${NEUPRINT_TOKEN:-}
      - NEUPRINT_DATASET=male-cns:v1.0
      - PYTHONPATH=/app/services/sim-engine
