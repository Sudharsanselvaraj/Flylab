name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx vitest run

  python:
    name: Python quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e 'services/sim-engine[dev]'
      - run: python -m compileall -q services/sim-engine scripts
      - run: python -m pytest services/sim-engine/tests/test_connectome.py services/sim-engine/tests/test_mapping.py services/sim-engine/tests/test_live_anatomy.py -q
